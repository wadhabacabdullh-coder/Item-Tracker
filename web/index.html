<title>Shadow Contract</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Single dark look on purpose: a night-time stealth game. Colours match the Unity build's Theme. */
:root {
  color-scheme: dark;
  --ground: #07090d;
  --panel: rgba(17, 20, 27, 0.94);
  --panel-2: #1a1f28;
  --line: #2a323e;
  --text: #e6ebf2;
  --dim: #8c99ad;
  --mist: #b5bfcc;
  --accent: #d14040;
  --accent-dark: #6b1a21;
  --gold: #f0c75e;
  --good: #73d980;
  --blue: #73a6f2;
  --warn: #ffb34d;
  --display: 'Silkscreen', 'Courier New', monospace;
  --body: 'VT323', 'Courier New', monospace;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--text); font-family: var(--body); font-size: 22px; line-height: 1.15; overflow: hidden; -webkit-font-smoothing: none; }
button { font: inherit; color: inherit; }
img.pix, .icon, .wicon, .wicon-big, .badge, .ico, .hud img, .preview img, .inv-map img { image-rendering: pixelated; }
.red { color: var(--accent); } .gold { color: var(--gold); } .good { color: var(--good); } .blue { color: var(--blue); } .dim { color: var(--dim); }
.mist { color: var(--mist); } .warn { color: var(--warn); } .teal { color: #59c1c9; } .pink { color: #ef7a6a; }
.big { font-size: 1.25em; } .small { font-size: 0.85em; } .center { text-align: center; }
#app { position: fixed; inset: 0; }

/* ---------------------------------------------------------------- loading */
#loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; padding: 0 16px; text-align: center; background: radial-gradient(ellipse at 50% 40%, #151b26, var(--ground) 70%); z-index: 50; }
#loading .logo { font-family: var(--display); font-size: clamp(34px, 9vw, 72px); line-height: 0.95; letter-spacing: 0.04em; }
#loading .logo span { color: var(--accent); display: block; }
#loading .bar { width: min(420px, 80vw); height: 10px; background: #000; border: 1px solid var(--line); margin: 0 auto; }
#loading .fill { height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
#loading .label { font-family: var(--display); font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
#loading.ready { cursor: pointer; }
#loading.ready .label { color: var(--text); animation: blink 1.1s steps(2) infinite; }
#loading .note { color: var(--dim); max-width: 36em; font-size: 20px; }
@keyframes blink { 50% { opacity: 0.35; } }

/* ---------------------------------------------------------------- game */
.game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; image-rendering: pixelated; }
.game-canvas.on { display: block; }
body.playing, body.playing .game-canvas { cursor: none; }

/* ---------------------------------------------------------------- HUD */
.hud { position: absolute; inset: 0; pointer-events: none; font-size: 20px; }
.hud.hidden { display: none; }
.hud .panel { position: absolute; background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; }
.hud .row { display: flex; align-items: center; gap: 8px; }
.hud .ico { width: 20px; height: 20px; flex: none; }
.hud .bar { position: relative; background: rgba(0,0,0,0.6); height: 12px; flex: 1; }
.hud .bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; }
.vignette { position: absolute; inset: 0; background-size: 100% 100%; image-rendering: auto; opacity: 0; filter: sepia(1) saturate(8) hue-rotate(-40deg) brightness(0.6); }
.flash { position: absolute; inset: 0; background: #000; opacity: 0; }
.hud-obj { top: 12px; left: 12px; width: min(330px, 46vw); padding-left: 14px; }
.hud-obj .accent-bar { position: absolute; left: 0; top: 8px; width: 3px; height: 18px; background: var(--accent); }
.hud-obj .zone { font-family: var(--display); font-size: 11px; letter-spacing: 0.1em; color: var(--dim); margin-bottom: 4px; }
.hud-obj .obj-lines div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-status { top: 12px; right: 12px; width: 230px; display: grid; gap: 6px; }
.hud-status .money { font-family: var(--display); color: var(--gold); font-size: 16px; }
.hud-status .detect-text { font-family: var(--display); font-size: 10px; width: 78px; text-align: right; }
.hud-mm { top: 88px; right: 12px; padding: 4px; }
.hud-mm canvas { display: block; width: 144px; height: 144px; image-rendering: pixelated; }
.hud-vitals { left: 12px; bottom: 12px; width: 270px; display: grid; gap: 6px; }
.hud-vitals .bar { height: 14px; }
.hud-vitals .bar.hp .fill { background: #d93338; }
.hud-vitals .bar.armor { height: 10px; background: rgba(8,18,38,0.9); }
.hud-vitals .bar.armor .fill { background: var(--blue); }
.hud-vitals .num { font-family: var(--display); font-size: 12px; width: 34px; text-align: right; }
.hud-vitals .num.blue { color: var(--blue); }
.hud-vitals .keys { font-family: var(--display); font-size: 10px; margin-left: auto; }
.hud-weapon { right: 12px; bottom: 12px; width: 290px; }
.hud-weapon .wicon { width: 96px; height: 48px; flex: none; }
.hud-weapon .col { flex: 1; min-width: 0; }
.hud-weapon .wname { font-family: var(--display); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-weapon .ammo { font-family: var(--display); font-size: 24px; }
.hud-weapon .ammo small { font-size: 13px; color: var(--dim); }
.hud-weapon .bar.reload { height: 5px; visibility: hidden; }
.hud-weapon .bar.reload .fill { background: var(--gold); }
.hud-weapon .slots { display: flex; gap: 4px; margin-top: 6px; }
.hud-weapon .slot { position: relative; flex: 1; height: 28px; background: #1a1f26; display: grid; place-items: center; }
.hud-weapon .slot.on { background: var(--accent-dark); outline: 1px solid var(--accent); }
.hud-weapon .slot img { width: 40px; height: 20px; }
.hud-weapon .slot .n { position: absolute; left: 3px; top: 0; font-size: 13px; color: var(--dim); }
.prompt { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); background: rgba(10,12,18,0.88); border: 1px solid var(--line); padding: 6px 16px; font-size: 24px; white-space: nowrap; display: none; }
.prompt .bar.hold { position: absolute; left: 10%; right: 10%; bottom: -8px; height: 6px; visibility: hidden; }
.prompt .bar.hold .fill { background: var(--gold); }
.toasts { position: absolute; left: 50%; bottom: 175px; transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; }
.toast { background: rgba(8,10,15,0.85); padding: 3px 14px; font-size: 22px; white-space: nowrap; }
.banner { position: absolute; top: 14vh; left: 0; right: 0; text-align: center; font-family: var(--display); font-size: clamp(22px, 4.2vw, 46px); text-shadow: 3px 3px 0 #000; opacity: 0; padding: 0 16px; }
.banner-sub { position: absolute; top: calc(14vh + clamp(34px, 5.4vw, 60px)); left: 0; right: 0; text-align: center; font-size: 28px; color: var(--dim); text-shadow: 2px 2px 0 #000; opacity: 0; padding: 0 16px; }
.warning { position: absolute; top: calc(14vh + clamp(70px, 9vw, 104px)); left: 0; right: 0; text-align: center; font-family: var(--display); font-size: clamp(16px, 2.6vw, 28px); color: var(--accent); text-shadow: 2px 2px 0 #000; opacity: 0; }
.floaters { position: absolute; inset: 0; overflow: hidden; }
.floaters > * { position: absolute; left: 0; top: 0; }
.npc-sub { background: rgba(5,5,8,0.82); padding: 2px 10px; font-size: 20px; white-space: nowrap; }
.radio { width: 110px; text-align: center; font-family: var(--display); font-size: 10px; color: var(--accent); }
.radio .bar { height: 7px; margin-top: 2px; background: rgba(0,0,0,0.7); }
.radio .bar .fill { background: var(--accent); }
.arrow { width: 27px; height: 21px; }
.cross { position: absolute; left: 0; top: 0; }

/* ---------------------------------------------------------------- menus */
.menus { position: absolute; inset: 0; display: none; overflow-y: auto; overscroll-behavior: contain; }
.menus.on { display: block; }
.menus.dim-bg { background: rgba(4,5,8,0.78); }
.menus.red-bg { background: rgba(20,3,6,0.9); }
.screen { min-height: 100%; box-sizing: border-box; padding: 24px clamp(16px, 3vw, 40px); display: flex; flex-direction: column; gap: 16px; background: var(--ground); }
.screen.overlay { background: transparent; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; letter-spacing: 0.03em; text-wrap: balance; }
h1 { font-size: clamp(26px, 4vw, 40px); } h2 { font-size: clamp(20px, 3vw, 30px); } h3 { font-size: 18px; }
.titlebar { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
.titlebar .sub { color: var(--dim); font-size: 24px; }
.funds { display: flex; align-items: center; gap: 8px; font-family: var(--display); color: var(--gold); font-size: 20px; }
.funds .icon { width: 24px; height: 24px; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 16px; min-width: 0; }
.head { font-family: var(--display); font-size: 13px; letter-spacing: 0.1em; margin: 6px 0 10px; }
.two-col { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; flex: 1; }
.two-col.bottom { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); flex: none; }
.footer, .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions { justify-content: flex-end; margin-top: 16px; }
.spacer { flex: 1; }
.btn { background: #151a22; border: 1px solid #38424f; padding: 9px 20px; font-family: var(--display); font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: background 0.1s, border-color 0.1s; }
.btn:hover:not(:disabled), .btn:focus-visible { background: #222935; border-color: var(--mist); outline: none; }
.btn.primary { background: var(--accent-dark); border-color: var(--accent); }
.btn.primary:hover:not(:disabled), .btn.primary:focus-visible { background: #8a222b; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.small { font-size: 11px; padding: 6px 12px; }
.btn.waiting { border-color: var(--gold); color: var(--gold); }
.menu-list { display: grid; gap: 10px; max-width: 340px; }
.menu-list .btn { text-align: left; padding: 12px 20px; font-size: 17px; }
.menu-list.narrow { margin: 10px auto 0; width: min(340px, 100%); }

.main-menu { background-size: cover; background-position: center; image-rendering: pixelated; padding: 0; position: relative; }
.main-menu .side { background: rgba(4,6,9,0.84); border-right: 3px solid var(--accent); width: min(460px, 100%); box-sizing: border-box; min-height: 100vh; padding: 48px clamp(16px, 4vw, 48px); display: flex; flex-direction: column; gap: 18px; }
.main-menu .logo { font-family: var(--display); font-size: clamp(40px, 7vw, 68px); line-height: 0.95; text-shadow: 4px 4px 0 #000; }
.main-menu .tag { color: var(--dim); font-size: 26px; }
.main-menu .funds-line { font-family: var(--display); color: var(--gold); font-size: 18px; margin-top: auto; }
.controls-hint { position: absolute; right: 24px; top: 20px; color: rgba(255,255,255,0.5); font-size: 20px; max-width: 46em; text-align: right; }
.reset { position: absolute; right: 24px; bottom: 24px; display: flex; gap: 12px; align-items: center; }
.confirm { color: var(--warn); }

.mission-list { display: grid; gap: 8px; }
.mission { position: relative; text-align: left; background: #12161d; border: 1px solid var(--line); padding: 10px 50px 10px 14px; cursor: pointer; }
.mission:hover:not(:disabled), .mission.sel { border-color: var(--accent); background: #1c1418; }
.mission:disabled { opacity: 0.55; cursor: not-allowed; }
.mission .mname { font-family: var(--display); font-size: 15px; }
.mission .mloc { color: var(--dim); }
.badge { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; }
.md-top { display: flex; gap: 20px; flex-wrap: wrap; }
.preview { background: #000; border: 1px solid var(--line); padding: 4px; flex: 0 1 360px; }
.preview img { display: block; width: 100%; }
.md-info { display: grid; gap: 6px; align-content: start; flex: 1 1 220px; }
.briefing { max-width: 62ch; font-size: 23px; line-height: 1.25; }
.objectives { color: var(--mist); }

.slot-cols { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.slot-col { display: flex; flex-direction: column; gap: 8px; }
.weapon-card { background: #151a21; border: 1px solid #38424f; padding: 8px; cursor: pointer; display: grid; justify-items: center; gap: 4px; }
.weapon-card:hover { border-color: var(--mist); }
.weapon-card.eq { background: var(--accent-dark); border-color: var(--accent); }
.wicon { width: 96px; height: 48px; }
.wicon-big { width: 192px; height: 96px; max-width: 100%; }
.detail .row, .shop-detail .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.stats { display: grid; gap: 4px; margin-top: 10px; }
.stat { display: grid; grid-template-columns: 30% 1fr 25%; gap: 10px; align-items: center; }
.stat .label { color: var(--dim); }
.stat .bar { height: 10px; background: rgba(0,0,0,0.5); position: relative; }
.stat .bar .fill { position: absolute; inset: 0 auto 0 0; }
.stat .val { text-align: right; font-variant-numeric: tabular-nums; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab.on { background: var(--accent-dark); border-color: var(--accent); }
.shop-list { display: grid; gap: 6px; }
.shop-item { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; align-items: center; text-align: left; background: #12161d; border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; }
.shop-item:hover, .shop-item.sel { border-color: var(--accent); }
.shop-item.sel { background: #1c1418; }
.shop-item.locked .wicon { filter: grayscale(1) brightness(0.45); }
.shop-item .price { font-family: var(--display); font-size: 13px; }
.icon-frame { background: rgba(0,0,0,0.45); padding: 10px; }
.feedback { font-family: var(--display); font-size: 12px; margin-right: auto; }

.setting { display: grid; grid-template-columns: minmax(120px, 40%) 1fr auto; gap: 12px; align-items: center; padding: 4px 0; }
.setting input[type=range] { width: 100%; accent-color: var(--accent); }
.setting .val { width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
.setting .sel-btn, .setting .bind-btn { grid-column: 2 / 4; justify-self: start; min-width: 120px; }
.binds { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); column-gap: 20px; margin-bottom: 12px; }
.setting.bind { grid-template-columns: 1fr auto; }
.setting.bind .bind-btn { grid-column: auto; font-size: 12px; padding: 5px 12px; }

.pause-card { margin: auto; width: min(460px, 100%); box-sizing: border-box; display: grid; gap: 14px; }
.inv-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; }
.inv-slot { display: flex; align-items: center; gap: 12px; padding: 6px 10px; background: #151a21; margin-bottom: 6px; }
.inv-slot.on { background: var(--accent-dark); }
.inv-mid { display: grid; gap: 16px; align-content: start; }
.inv-map { position: relative; max-width: 100%; }
.inv-map img { display: block; width: 100%; height: 100%; }
.inv-map .you { position: absolute; width: 10px; height: 10px; background: var(--accent); transform: translate(-50%, -50%); outline: 2px solid #fff; }
.result-card { margin: auto; width: min(1000px, 100%); box-sizing: border-box; display: grid; gap: 12px; }
.result-card .rule { height: 3px; background: var(--accent); }
.kv { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed #232a34; padding: 2px 0; font-variant-numeric: tabular-nums; }
.bonus { padding: 2px 0; }
.total { font-family: var(--display); font-size: 24px; margin-top: 12px; }
.gameover { justify-content: center; text-align: center; align-items: center; }
.huge { font-size: clamp(34px, 8vw, 80px); text-shadow: 4px 4px 0 #000; }

@media (max-width: 860px) {
  .two-col, .two-col.bottom, .inv-grid { grid-template-columns: minmax(0, 1fr); }
  .slot-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .controls-hint { display: none; }
  .reset { position: static; padding: 16px; }
  .main-menu .side { min-height: auto; }
  .hud-mm { display: none; }
}
@media (prefers-reduced-motion: reduce) { #loading.ready .label { animation: none; } }
</style>

<div id="app"></div>
<div id="loading">
  <div class="logo">SHADOW<span>CONTRACT</span></div>
  <div class="bar"><div class="fill"></div></div>
  <div class="label">Loading</div>
  <div class="note">A top-down stealth game. Best with a keyboard and mouse: WASD to move, mouse to aim, E to interact. Sound on.</div>
</div>
<script>/*__GAME_JS__*/</script>
